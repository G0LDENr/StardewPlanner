<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a192b">
  <title>Favoritos - Stardew Planner</title>
  
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/favoritos.css">
  <link rel="icon" type="image/png" href="../images/icons/icon.png">
  
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div id="overlay" class="overlay"></div>

  <header class="top-bar">
    <button id="menuBtn" class="menu-btn" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
    <h1 class="app-title">Stardew Planner</h1>
  </header>

  <nav id="dropdownMenu" class="dropdown-menu">
    <a href="../index.html" class="dropdown-item"><i data-lucide="home"></i> Inicio</a>
    <a href="Favoritos.html" class="dropdown-item active"><i data-lucide="star"></i> Favoritos</a>
    <a href="#" class="dropdown-item"><i data-lucide="settings"></i> Configuración</a>
    <a href="#" class="dropdown-item"><i data-lucide="info"></i> Acerca de</a>
  </nav>

  <main class="main-content">

    <div class="search-filter-section">
      <div class="search-row">
        <div class="search-bar">
          <i data-lucide="search"></i>
          <input type="text" id="inputBuscar" placeholder="Buscar en favoritos...">
        </div>
        <button class="sort-btn" id="btnOrdenAZ">A - Z</button>
      </div>

      <div class="filter-row">
        <select id="selectEstacion" class="custom-select">
          <option value="Todas">Estación: Todas</option>
          <option value="Primavera">Primavera</option>
          <option value="Verano">Verano</option>
          <option value="Otoño">Otoño</option>
          <option value="Invierno">Invierno</option>
        </select>

        <select id="selectCategoria" class="custom-select">
          <option value="todos">Categoría: Todas</option>
          <option value="cultivos">Cultivos</option>
          <option value="pesca">Pesca</option>
          <option value="animal">Animal</option>
        </select>
      </div>
    </div>

    <div class="view-content" id="listaFavoritos"></div>

  </main>

  <!-- 👇 MODAL AGREGADO AQUÍ 👇 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content" id="modalContent">
      
      <div class="modal-actions">
        <button class="fav-modal-btn" id="btnFavoritoModal"><i data-lucide="star"></i></button>
        <button class="close-modal" id="closeModal"><i data-lucide="x"></i></button>
      </div>
      
      <div class="modal-header" id="modalHeader">
        <div class="modal-img-container" id="modalImgContainer"></div>
        <div class="modal-title-text">
          <h2 id="modalTitulo"></h2>
          <div id="modalEstaciones" class="modal-badges-container"></div>
        </div>
      </div>

      <div class="modal-body">
        <!-- Datos comunes (se ocultan/muestran según la categoría) -->
        <div class="info-row" id="rowCrecimiento" style="display:none;">
          <span><i data-lucide="timer"></i> Crecimiento:</span>
          <strong id="modalCrecimiento"></strong>
        </div>
        <div class="info-row" id="rowRegeneracion" style="display:none;">
          <span><i data-lucide="refresh-cw"></i> Cosecha:</span>
          <strong id="modalRegeneracion"></strong>
        </div>
        <div class="info-row" id="rowVendedor" style="display:none;">
          <span><i data-lucide="store"></i> Vendedor:</span>
          <strong id="modalVendedor"></strong>
        </div>

        <!-- Datos de Pesca -->
        <div class="info-row" id="rowLugar" style="display:none;">
          <span><i data-lucide="map-pin"></i> Lugar:</span>
          <strong id="modalLugar"></strong>
        </div>
        <div class="info-row" id="rowDificultad" style="display:none;">
          <span><i data-lucide="activity"></i> Dificultad:</span>
          <strong id="modalDificultad"></strong>
        </div>
        <div class="info-row" id="rowClima" style="display:none;">
          <span><i data-lucide="cloud-sun"></i> Clima:</span>
          <strong id="modalClima"></strong>
        </div>
        <div class="info-row" id="rowEvento" style="display:none;">
          <span><i data-lucide="calendar-heart"></i> Evento:</span>
          <strong id="modalEvento"></strong>
        </div>

        <!-- Datos de Animales -->
        <div class="info-row" id="rowMaquina" style="display:none;">
          <span><i data-lucide="cog"></i> Máquina:</span>
          <strong id="modalMaquina"></strong>
        </div>
        <div class="info-row" id="rowHerramienta" style="display:none;">
          <span><i data-lucide="wrench"></i> Herramienta:</span>
          <strong id="modalHerramienta"></strong>
        </div>
        <div class="info-row" id="rowProduccion" style="display:none;">
          <span><i data-lucide="timer"></i> Producción:</span>
          <strong id="modalProduccion"></strong>
        </div>

        <h4>Precios de Venta</h4>
        <div class="precios-grid">
          <div class="precio-box normal"><span>Normal</span><strong id="precioNormal"></strong></div>
          <div class="precio-box plata"><span>Plata</span><strong id="precioPlata"></strong></div>
          <div class="precio-box oro"><span>Oro</span><strong id="precioOro"></strong></div>
          <div class="precio-box iridio"><span>Iridio</span><strong id="precioIridio"></strong></div>
        </div>

        <!-- Nota o Tip (segun categoría) -->
        <div class="modal-note" id="rowNota" style="display:none;">
          <p id="modalNota"></p>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="../index.html" class="nav-item" data-page="inicio">
      <span class="nav-icon"><i data-lucide="home"></i></span><span class="nav-label">Inicio</span>
    </a>
    <a href="Cultivos.html" class="nav-item" data-page="cultivos">
      <span class="nav-icon"><i data-lucide="wheat"></i></span><span class="nav-label">Cultivos</span>
    </a>
    <a href="Pesca.html" class="nav-item" data-page="pesca">
      <span class="nav-icon"><i data-lucide="fish"></i></span><span class="nav-label">Pesca</span>
    </a>
    <a href="Animal.html" class="nav-item" data-page="animal">
      <span class="nav-icon"><i data-lucide="egg"></i></span><span class="nav-label">Animal</span>
    </a>
    <a href="Calculadora.html" class="nav-item" data-page="calculadora">
      <span class="nav-icon"><i data-lucide="calculator"></i></span><span class="nav-label">Calculadora</span>
    </a>
  </nav>

  <script src="../database/cultivos.js"></script>
  <script src="../database/pesca.js"></script>
  <script src="../database/animal.js"></script>
  <script src="../app.js"></script>
  <script src="../js/favoritos.js"></script>
</body>
</html>
