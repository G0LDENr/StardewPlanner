<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a192b">
  <title>Favoritos - Stardew Planner</title>
  
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/favoritos.css">
  <link rel="icon" type="image/png" href="../images/icons/icon.png">
  
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div id="overlay" class="overlay"></div>

  <header class="top-bar">
    <button id="menuBtn" class="menu-btn" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
    <h1 class="app-title">Stardew Planner</h1>
  </header>

  <nav id="dropdownMenu" class="dropdown-menu">
    <a href="../index.html" class="dropdown-item"><i data-lucide="home"></i> Inicio</a>
    <a href="Favoritos.html" class="dropdown-item active"><i data-lucide="star"></i> Favoritos</a>
    <a href="#" class="dropdown-item"><i data-lucide="settings"></i> Configuración</a>
    <a href="#" class="dropdown-item"><i data-lucide="info"></i> Acerca de</a>
  </nav>

  <main class="main-content">

    <div class="search-filter-section">
      <!-- Fila 1: Buscador y botón de orden -->
      <div class="search-row">
        <div class="search-bar">
          <i data-lucide="search"></i>
          <input type="text" id="inputBuscar" placeholder="Buscar en favoritos...">
        </div>
        <button class="sort-btn" id="btnOrdenAZ">A - Z</button>
      </div>

      <!-- 👇 Fila 2: Selects de Estación y Categoría lado a lado -->
      <div class="filter-row">
        <select id="selectEstacion" class="custom-select">
          <option value="Todas">Estación: Todas</option>
          <option value="Primavera">Primavera</option>
          <option value="Verano">Verano</option>
          <option value="Otoño">Otoño</option>
          <option value="Invierno">Invierno</option>
        </select>

        <select id="selectCategoria" class="custom-select">
          <option value="todos">Categoría: Todas</option>
          <option value="cultivos">Cultivos</option>
          <option value="pesca">Pesca</option>
          <option value="animal">Animal</option>
        </select>
      </div>
    </div>

    <!-- CONTENEDOR DE FAVORITOS -->
    <div class="view-content" id="listaFavoritos"></div>

  </main>

  <nav class="bottom-nav">
    <a href="../index.html" class="nav-item" data-page="inicio">
      <span class="nav-icon"><i data-lucide="home"></i></span><span class="nav-label">Inicio</span>
    </a>
    <a href="Cultivos.html" class="nav-item" data-page="cultivos">
      <span class="nav-icon"><i data-lucide="wheat"></i></span><span class="nav-label">Cultivos</span>
    </a>
    <a href="Pesca.html" class="nav-item" data-page="pesca">
      <span class="nav-icon"><i data-lucide="fish"></i></span><span class="nav-label">Pesca</span>
    </a>
    <a href="Animal.html" class="nav-item" data-page="animal">
      <span class="nav-icon"><i data-lucide="egg"></i></span><span class="nav-label">Animal</span>
    </a>
    <a href="Calculadora.html" class="nav-item" data-page="calculadora">
      <span class="nav-icon"><i data-lucide="calculator"></i></span><span class="nav-label">Calculadora</span>
    </a>
  </nav>

  <script src="../database/cultivos.js"></script>
  <script src="../database/pesca.js"></script>
  <script src="../database/animal.js"></script>
  <script src="../app.js"></script>
  <script src="../js/favoritos.js"></script>
</body>
</html>
