<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a192b">
  <title>Calculadora - Stardew Planner</title>
  
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/calculadora.css">
  <link rel="icon" type="image/png" href="../images/icons/icon.png">
  
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div id="overlay" class="overlay"></div>

  <header class="top-bar">
    <button id="menuBtn" class="menu-btn" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
    <h1 class="app-title">Stardew Planner</h1>
  </header>

  <nav id="dropdownMenu" class="dropdown-menu">
    <a href="../index.html" class="dropdown-item"><i data-lucide="home"></i> Inicio</a>
    <a href="#" class="dropdown-item"><i data-lucide="settings"></i> Configuración</a>
    <a href="#" class="dropdown-item"><i data-lucide="star"></i> Favoritos</a>
    <a href="#" class="dropdown-item"><i data-lucide="info"></i> Acerca de</a>
  </nav>

  <main class="main-content">

    <div class="calc-header">
      <h2>Calculadora de Ganancias</h2>
      <p>Agrega tus productos para calcular el total.</p>
    </div>

    <!-- 🔽 SELECTOR DE PRODUCTOS -->
    <div class="calc-selector">
      <select id="selectProducto">
        <option value="" disabled selected>Selecciona un producto...</option>
        <!-- Se llena con JS -->
      </select>
      <button id="btnAgregar" class="btn-add"><i data-lucide="plus"></i></button>
    </div>

    <!-- 🛒 LISTA DE PRODUCTOS AGREGADOS -->
    <div class="calc-list" id="listaCalculo">
      <p class="empty-msg">No has agregado ningún producto.</p>
    </div>

    <!-- 💰 TOTAL Y BOTÓN -->
    <div class="calc-footer">
      <div class="total-box">
        <span>Total:</span>
        <strong id="totalGanancias">0g</strong>
      </div>
      <button id="btnCalcular" class="btn-calc">Calcular Total</button>
    </div>

  </main>

  <nav class="bottom-nav">
    <a href="../index.html" class="nav-item" data-page="inicio">
      <span class="nav-icon"><i data-lucide="home"></i></span><span class="nav-label">Inicio</span>
    </a>
    <a href="Cultivos.html" class="nav-item" data-page="cultivos">
      <span class="nav-icon"><i data-lucide="wheat"></i></span><span class="nav-label">Cultivos</span>
    </a>
    <a href="Pesca.html" class="nav-item" data-page="pesca">
      <span class="nav-icon"><i data-lucide="fish"></i></span><span class="nav-label">Pesca</span>
    </a>
    <a href="Animal.html" class="nav-item" data-page="animal">
      <span class="nav-icon"><i data-lucide="egg"></i></span><span class="nav-label">Animal</span>
    </a>
    <a href="Calculadora.html" class="nav-item active" data-page="calculadora">
      <span class="nav-icon"><i data-lucide="calculator"></i></span><span class="nav-label">Calculadora</span>
    </a>
  </nav>

  <!-- Cargamos las 3 bases de datos -->
  <script src="../database/cultivos.js"></script>
  <script src="../database/pesca.js"></script>
  <script src="../database/animal.js"></script>
  
  <script src="../app.js"></script>
  <script src="../js/calculadora.js"></script>
</body>
</html>
