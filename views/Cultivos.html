<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a192b">
  <title>Cultivos - Stardew Planner</title>
  
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/cultivos.css">
  <link rel="icon" type="image/png" href="../images/icons/icon.png">
  
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div id="overlay" class="overlay"></div>

  <header class="top-bar">
    <button id="menuBtn" class="menu-btn" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
    <h1 class="app-title">Stardew Planner</h1>
  </header>

  <nav id="dropdownMenu" class="dropdown-menu">
    <a href="../index.html" class="dropdown-item"><i data-lucide="home"></i> Inicio</a>
    <a href="#" class="dropdown-item"><i data-lucide="settings"></i> Configuración</a>
    <a href="#" class="dropdown-item"><i data-lucide="star"></i> Favoritos</a>
    <a href="#" class="dropdown-item"><i data-lucide="info"></i> Acerca de</a>
  </nav>

  <main class="main-content">

    <div class="search-filter-section">
      <div class="search-row">
        <div class="search-bar">
          <i data-lucide="search"></i>
          <input type="text" id="inputBuscar" placeholder="Buscar por nombre...">
        </div>
        <button class="sort-btn" id="btnOrdenAZ">A - Z</button>
      </div>

      <div class="filter-chips" id="filtrosEstacion">
        <button class="chip active" data-estacion="Todas">Todas</button>
        <button class="chip" data-estacion="Primavera">Primavera</button>
        <button class="chip" data-estacion="Verano">Verano</button>
        <button class="chip" data-estacion="Otoño">Otoño</button>
        <button class="chip" data-estacion="Invierno">Invierno</button>
      </div>
    </div>

    <div class="view-content" id="listaCultivos"></div>

  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content" id="modalContent">
      <button class="close-modal" id="closeModal"><i data-lucide="x"></i></button>
      
      <div class="modal-header" id="modalHeader">
        <div class="modal-img-container" id="modalImgContainer"></div>
        <div class="modal-title-text">
          <h2 id="modalTitulo"></h2>
          <div id="modalEstaciones" class="modal-badges-container"></div>
        </div>
      </div>

      <div class="modal-body">
        <div class="info-row">
          <span><i data-lucide="timer"></i> Crecimiento:</span>
          <strong id="modalCrecimiento"></strong>
        </div>
        <div class="info-row">
          <span><i data-lucide="refresh-cw"></i> Cosecha:</span>
          <strong id="modalRegeneracion"></strong>
        </div>
        
        <!-- 👇 VENDEDOR SIEMPRE ABAJO Y CENTRADO -->
        <div class="info-row-seller">
          <div class="seller-header">
            <i data-lucide="store"></i> Vendedor:
          </div>
          <div id="modalVendedor" class="seller-text"></div>
        </div>

        <h4>Precios de Venta</h4>
        <div class="precios-grid">
          <div class="precio-box normal"><span>Normal</span><strong id="precioNormal"></strong></div>
          <div class="precio-box plata"><span>Plata</span><strong id="precioPlata"></strong></div>
          <div class="precio-box oro"><span>Oro</span><strong id="precioOro"></strong></div>
          <div class="precio-box iridio"><span>Iridio</span><strong id="precioIridio"></strong></div>
        </div>

        <div class="modal-note">
          <p id="modalTip"></p>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="../index.html" class="nav-item" data-page="inicio">
      <span class="nav-icon"><i data-lucide="home"></i></span><span class="nav-label">Inicio</span>
    </a>
    <a href="Cultivos.html" class="nav-item active" data-page="cultivos">
      <span class="nav-icon"><i data-lucide="wheat"></i></span><span class="nav-label">Cultivos</span>
    </a>
    <a href="Pesca.html" class="nav-item" data-page="pesca">
      <span class="nav-icon"><i data-lucide="fish"></i></span><span class="nav-label">Pesca</span>
    </a>
    <a href="Animal.html" class="nav-item" data-page="animal">
      <span class="nav-icon"><i data-lucide="egg"></i></span><span class="nav-label">Animal</span>
    </a>
    <a href="Calculadora.html" class="nav-item" data-page="calculadora">
      <span class="nav-icon"><i data-lucide="calculator"></i></span><span class="nav-label">Calculadora</span>
    </a>
  </nav>

  <script src="../database/cultivos.js"></script>
  <script src="../app.js"></script>
  <script src="../js/cultivos.js"></script>
</body>
</html>
