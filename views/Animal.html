<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a192b">
  <title>Animal - Stardew Planner</title>
  
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/animal.css">
  <link rel="icon" type="image/png" href="../images/icons/icon.png">
  
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div id="overlay" class="overlay"></div>

  <header class="top-bar">
    <button id="menuBtn" class="menu-btn" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
    <h1 class="app-title">Stardew Planner</h1>
  </header>

  <nav id="dropdownMenu" class="dropdown-menu">
    <a href="../index.html" class="dropdown-item"><i data-lucide="home"></i> Inicio</a>
    <a href="#" class="dropdown-item"><i data-lucide="settings"></i> Configuración</a>
    <a href="#" class="dropdown-item"><i data-lucide="star"></i> Favoritos</a>
    <a href="#" class="dropdown-item"><i data-lucide="info"></i> Acerca de</a>
  </nav>

  <main class="main-content">

    <!-- 🔍 BUSCADOR -->
    <div class="search-filter-section">
      <div class="search-bar">
        <i data-lucide="search"></i>
        <input type="text" id="inputBuscar" placeholder="Buscar producto...">
      </div>
    </div>

    <!-- 📦 CONTENEDOR DE CARDS -->
    <div class="view-content" id="listaAnimal">
      <!-- Las tarjetas se generan con JavaScript -->
    </div>

  </main>

  <!-- VENTANA MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="close-modal" id="closeModal"><i data-lucide="x"></i></button>
      <div class="modal-header">
        <img id="modalImg" src="" alt="">
        <div class="modal-title-text">
          <h2 id="modalTitulo"></h2>
          <span id="modalCategoria" class="badge"></span> 
        </div>
      </div>
      <div class="modal-body">
        <!-- Máquina -->
        <div class="info-row">
          <span><i data-lucide="cog"></i> Máquina:</span>
          <strong id="modalMaquina"></strong>
        </div>

        <!-- Herramienta -->
        <div class="info-row">
          <span><i data-lucide="wrench"></i> Herramienta:</span>
          <strong id="modalHerramienta"></strong>
        </div>

        <!-- Producción -->
        <div class="info-row">
          <span><i data-lucide="timer"></i> Producción:</span>
          <strong id="modalProduccion"></strong>
        </div>
        
        <h4>Precios de Venta</h4>
        <div class="precios-grid">
          <div class="precio-box normal"><span>Normal</span><strong id="precioNormal"></strong></div>
          <div class="precio-box plata"><span>Plata</span><strong id="precioPlata"></strong></div>
          <div class="precio-box oro"><span>Oro</span><strong id="precioOro"></strong></div>
          <div class="precio-box iridio"><span>Iridio</span><strong id="precioIridio"></strong></div>
        </div>

        <!-- NOTA INFORMATIVA -->
        <div class="modal-note">
          <p id="modalNota"></p>
        </div>

      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="../index.html" class="nav-item" data-page="inicio">
      <span class="nav-icon"><i data-lucide="home"></i></span><span class="nav-label">Inicio</span>
    </a>
    <a href="Cultivos.html" class="nav-item" data-page="cultivos">
      <span class="nav-icon"><i data-lucide="wheat"></i></span><span class="nav-label">Cultivos</span>
    </a>
    <a href="Pesca.html" class="nav-item" data-page="pesca">
      <span class="nav-icon"><i data-lucide="fish"></i></span><span class="nav-label">Pesca</span>
    </a>
    <a href="Animal.html" class="nav-item active" data-page="animal">
      <span class="nav-icon"><i data-lucide="bird"></i></span><span class="nav-label">Animal</span>
    </a>
    <a href="#" class="nav-item" data-page="calculadora">
      <span class="nav-icon"><i data-lucide="calculator"></i></span><span class="nav-label">Calculadora</span>
    </a>
  </nav>

  <script src="../database/animal.js"></script>
  <script src="../app.js"></script>
  <script src="../js/animal.js"></script>
</body>
</html>
