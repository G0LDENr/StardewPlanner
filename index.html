<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a192b">
  <title>Stardew Planner</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="images/icons/icon.png">
  
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div id="overlay" class="overlay"></div>

  <header class="top-bar">
    <button id="menuBtn" class="menu-btn" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
    <h1 class="app-title">
        Stardew Planner
    </h1>
  </header>

  <nav id="dropdownMenu" class="dropdown-menu">
    <a href="#" class="dropdown-item">
      <i data-lucide="home"></i> Inicio
    </a>
    <a href="#" class="dropdown-item">
      <i data-lucide="settings"></i> Configuración
    </a>
    <a href="#" class="dropdown-item">
      <i data-lucide="star"></i> Favoritos
    </a>
    <a href="#" class="dropdown-item">
      <i data-lucide="info"></i> Acerca de
    </a>
  </nav>

  <main class="main-content">

    <section class="hero-section">
      <div class="hero-overlay">
        <h2>!Hola, Granjero!</h2>
        <p>Aqui tienes un resumen de tu granja y las herramientas para sacarle el máximo provecho.</p>
      </div>
    </section>

    <section class="buttons-column">
      
      <!-- Botón enlazado a cultivos.html -->
      <a href="views/cultivos.html" class="action-btn" data-action="cultivos">
        <div class="btn-icon">
          <img src="svg/Planta.svg" alt="Cultivos">
        </div>
        <div class="btn-text">
          <span class="btn-title">Cultivos</span>
          <span class="btn-desc">Fechas de siembra, crecimiento y ganancias</span>
        </div>
        <div class="btn-arrow">
          <i data-lucide="chevron-right"></i>
        </div>
      </a>

      <button class="action-btn" data-action="pesca">
        <div class="btn-icon">
          <img src="svg/Pesca.svg" alt="Pesca">
        </div>
        <div class="btn-text">
          <span class="btn-title">Pesca</span>
          <span class="btn-desc">Registro de capturas y ganancias</span>
        </div>
        <div class="btn-arrow">
          <i data-lucide="chevron-right"></i>
        </div>
      </button>

      <button class="action-btn" data-action="animales">
        <div class="btn-icon">
          <img src="svg/Vaca.svg" alt="Animales">
        </div>
        <div class="btn-text">
          <span class="btn-title">Animales</span>
          <span class="btn-desc">Control de producción y cuidado diario</span>
        </div>
        <div class="btn-arrow">
          <i data-lucide="chevron-right"></i>
        </div>
      </button>

      <button class="action-btn" data-action="calculadora">
        <div class="btn-icon">
          <img src="svg/Calculadora.svg" alt="Calculadora">
        </div>
        <div class="btn-text">
          <span class="btn-title">Calculadora</span>
          <span class="btn-desc">Calcula ingresos y gastos de tu granja</span>
        </div>
        <div class="btn-arrow">
          <i data-lucide="chevron-right"></i>
        </div>
      </button>

    </section>

  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active" data-page="inicio">
      <span class="nav-icon"><i data-lucide="home"></i></span>
      <span class="nav-label">Inicio</span>
    </a>
    <a href="views/cultivos.html" class="nav-item" data-page="cultivos">
      <span class="nav-icon"><i data-lucide="wheat"></i></span>
      <span class="nav-label">Cultivos</span>
    </a>
    <a href="#" class="nav-item" data-page="pesca">
      <span class="nav-icon"><i data-lucide="fish"></i></span>
      <span class="nav-label">Pesca</span>
    </a>
    <a href="#" class="nav-item" data-page="animales">
      <span class="nav-icon"><i data-lucide="bird"></i></span>
      <span class="nav-label">Animales</span>
    </a>
    <a href="#" class="nav-item" data-page="calculadora">
      <span class="nav-icon"><i data-lucide="calculator"></i></span>
      <span class="nav-label">Calculadora</span>
    </a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
